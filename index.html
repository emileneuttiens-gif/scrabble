<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Scrabble Camera</title>
<style>
  /* Minimalistisch: de camera vult het scherm, bovenaan één regel status, onderaan alleen wat je nu nodig hebt */
  :root {
    --zwart: #000;
    --glas: rgba(0, 0, 0, 0.55);
    --wit: #f5f5f2;
    --grijs: rgba(245, 245, 242, 0.62);
    --groen: #7fd18b;
    --oranje: #f0c36b;
    --letter: -apple-system, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--zwart); color: var(--wit); font: 15px/1.4 var(--letter); overflow: hidden; }

  .camera { position: fixed; inset: 0; }
  .camera video, .camera canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .camera video { z-index: 0; }
  .camera canvas { z-index: 1; touch-action: none; }

  #status { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 50%; transform: translateX(-50%);
            padding: 6px 14px; border-radius: 999px; background: var(--glas); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            font-size: 13px; color: var(--grijs); white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
  #status::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; background: var(--grijs); }
  #status.zoek::before { background: var(--oranje); }
  #status.ok { color: var(--wit); }
  #status.ok::before { background: var(--groen); }
  #status.fout { color: var(--wit); }
  #status.fout::before { background: #ff5a4f; }

  .onder { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; display: grid; justify-items: center; gap: 12px;
           padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(16px, env(safe-area-inset-left, 0px)); }

  button { font: 600 15px var(--letter); color: var(--wit); border: 0; cursor: pointer; border-radius: 999px; padding: 12px 22px;
           background: var(--glas); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  button:focus-visible { outline: 2px solid var(--wit); outline-offset: 2px; }
  button.hoofd { background: var(--wit); color: #000; padding: 14px 28px; font-size: 16px; }
  button.ja { background: var(--groen); color: #000; }
  button.stil { background: none; backdrop-filter: none; -webkit-backdrop-filter: none; color: var(--grijs); font-weight: 500; padding: 8px 10px; font-size: 14px; white-space: nowrap; }
  #acties { flex-wrap: nowrap; gap: 2px; }

  .vraag { display: grid; justify-items: center; gap: 12px; }
  .vraag p { margin: 0; font-size: 18px; font-weight: 600; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  button.letter { width: 44px; height: 44px; padding: 0; font-size: 18px; border-radius: 10px; background: var(--wit); color: #000; }
  .rij { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  #recht { position: fixed; z-index: 4; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
           width: min(34vw, 180px); height: auto; aspect-ratio: 1; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: #111; }
  #scores { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 50px); left: 50%; transform: translateX(-50%);
            display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: max-content; max-width: calc(100vw - 24px); }
  button.speler { display: flex; gap: 8px; align-items: baseline; padding: 6px 12px; font-size: 13px; font-weight: 500; color: var(--grijs); }
  button.speler b { font-size: 15px; color: var(--wit); font-variant-numeric: tabular-nums; }
  button.speler.aan { color: var(--wit); box-shadow: inset 0 0 0 1.5px var(--groen); }
  #menu { position: fixed; inset: 0; z-index: 10; background: var(--zwart); display: grid; place-items: center;
          padding: max(24px, env(safe-area-inset-top, 0px)) 16px max(24px, env(safe-area-inset-bottom, 0px)); }
  .scherm { display: grid; justify-items: center; gap: 18px; width: min(100%, 340px); }
  .scherm h1 { margin: 0 0 28px; font-size: 34px; font-weight: 700; letter-spacing: 0.02em; }
  .scherm h2 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  #spelerLijst { list-style: none; margin: 0; padding: 0; width: 100%; display: grid; gap: 10px; }
  #spelerLijst li { display: flex; align-items: center; gap: 8px; }
  #spelerLijst input { flex: 1; min-width: 0; font: 16px var(--letter); color: var(--wit); background: rgba(255,255,255,0.08);
                       border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 12px 14px; outline: none; }
  #spelerLijst input:focus { border-color: var(--groen); }
  #spelerLijst input::placeholder { color: rgba(245,245,242,0.38); }
  button.weg { width: 40px; height: 40px; padding: 0; font-size: 20px; line-height: 1; color: var(--grijs); background: none; }
  #begin { width: 100%; margin-top: 10px; }
  #fout { margin: 0; color: var(--oranje); text-align: center; max-width: 34ch; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
</style>
</head>
<body>
  <div class="camera" id="camera">
    <video id="video" playsinline muted></video>
    <canvas id="over"></canvas>
  </div>

  <div id="menu">
    <section id="welkom" class="scherm">
      <h1>Scrabble</h1>
      <button class="hoofd" id="nieuwSpel">Start spel</button>
    </section>
    <section id="spelersScherm" class="scherm" hidden>
      <h2>Spelers</h2>
      <ol id="spelerLijst"></ol>
      <button class="stil" id="spelerErbij">+ Speler toevoegen</button>
      <button class="hoofd" id="begin">Begin</button>
      <button class="stil" id="menuTerug">Terug</button>
    </section>
  </div>

  <div id="status" role="status" hidden>Scrabble</div>
  <div id="scores" hidden></div>
  <canvas id="recht" width="450" height="450" hidden></canvas>

  <div class="onder">
    <p id="fout" hidden></p>

    <div id="startvak" hidden>
      <button class="hoofd" id="start">Camera starten</button>
    </div>

    <div class="vraag" id="vraag" hidden>
      <p>Is dit het bord?</p>
      <div class="rij">
        <button class="ja" id="ja">Ja</button>
        <button id="nee">Nee</button>
      </div>
    </div>

    <div class="vraag" id="jokervraag" hidden>
      <p>Welke letter is de joker?</p>
      <div class="rij" id="jokeropties"></div>
    </div>

    <div class="rij" id="acties" hidden>
      <button class="stil" id="hand" aria-pressed="false">Zelf aanduiden</button>
      <button class="stil" id="terug" disabled>Zet terug</button>
      <button class="stil" id="opnieuw" disabled>Opnieuw zoeken</button>
    </div>
  </div>
<script src="woordenboek.js?v=1"></script>
<script src="lezer.js?v=2"></script>
<script src="app.js?v=14"></script>
</body>
</html>

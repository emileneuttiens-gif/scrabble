<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Scrabble Camera</title>
<style>
  /* Minimalistisch: de camera vult het scherm, bovenaan één regel status, onderaan alleen wat je nu nodig hebt */
  :root {
    --zwart: #000;
    --glas: rgba(0, 0, 0, 0.55);
    --wit: #f5f5f2;
    --grijs: rgba(245, 245, 242, 0.62);
    --groen: #7fd18b;
    --oranje: #f0c36b;
    --letter: -apple-system, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--zwart); color: var(--wit); font: 15px/1.4 var(--letter); overflow: hidden; }

  .camera { position: fixed; inset: 0; }
  .camera video, .camera canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .camera video { z-index: 0; }
  .camera canvas { z-index: 1; touch-action: none; }

  #status { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 50%; transform: translateX(-50%);
            padding: 6px 14px; border-radius: 999px; background: var(--glas); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            font-size: 13px; color: var(--grijs); white-space: nowrap; }
  #status::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; background: var(--grijs); }
  #status.zoek::before { background: var(--oranje); }
  #status.ok { color: var(--wit); }
  #status.ok::before { background: var(--groen); }

  .onder { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; display: grid; justify-items: center; gap: 12px;
           padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(16px, env(safe-area-inset-left, 0px)); }

  button { font: 600 15px var(--letter); color: var(--wit); border: 0; cursor: pointer; border-radius: 999px; padding: 12px 22px;
           background: var(--glas); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  button:focus-visible { outline: 2px solid var(--wit); outline-offset: 2px; }
  button.hoofd { background: var(--wit); color: #000; padding: 14px 28px; font-size: 16px; }
  button.ja { background: var(--groen); color: #000; }
  button.stil { background: none; backdrop-filter: none; -webkit-backdrop-filter: none; color: var(--grijs); font-weight: 500; padding: 8px 12px; }

  .vraag { display: grid; justify-items: center; gap: 12px; }
  .vraag p { margin: 0; font-size: 18px; font-weight: 600; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .rij { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  #recht { position: fixed; z-index: 4; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
           width: min(34vw, 180px); height: auto; aspect-ratio: 1; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: #111; }
  #fout { margin: 0; color: var(--oranje); text-align: center; max-width: 34ch; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
</style>
</head>
<body>
  <div class="camera" id="camera">
    <video id="video" playsinline muted></video>
    <canvas id="over"></canvas>
  </div>

  <div id="status" role="status">Scrabble</div>
  <canvas id="recht" width="450" height="450" hidden></canvas>

  <div class="onder">
    <p id="fout" hidden></p>

    <div id="startvak">
      <button class="hoofd" id="start">Camera starten</button>
    </div>

    <div class="vraag" id="vraag" hidden>
      <p>Is dit het bord?</p>
      <div class="rij">
        <button class="ja" id="ja">Ja</button>
        <button id="nee">Nee</button>
      </div>
    </div>

    <div class="rij" id="acties" hidden>
      <button class="stil" id="hand" aria-pressed="false">Zelf aanduiden</button>
      <button class="stil" id="opnieuw" disabled>Opnieuw zoeken</button>
    </div>
  </div>
<script src="app.js?v=6"></script>
</body>
</html>
